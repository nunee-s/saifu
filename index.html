<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5ead8">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Saifu — who owes what</title>
  <style>
    @font-face{font-family:PerfectLemonade;src:url('fonts/perfect-lemonade.otf') format('opentype');font-display:swap}
    :root{--bg:#fff;--paper:#fff;--ink:#111;--muted:#666;--orange:#111;--orange-dark:#111;--sage:#111;--sage-light:#f3f3f3;--line:#ddd;--shadow:0 4px 16px #0000000d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}main{max-width:520px;margin:auto;padding:20px 16px 92px}
    h1,h2,h3,p{margin:0}h1,h2,h3{font-family:PerfectLemonade,ui-sans-serif,sans-serif;font-weight:400}h1{font-size:34px;letter-spacing:.2px;color:var(--orange-dark)}h2{font-size:25px}h3{font-size:19px}.muted{color:var(--muted);font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{display:block;width:58px;height:58px;border-radius:14px}.brand small{display:block;color:var(--sage);font-weight:600;font-size:10px;letter-spacing:.08em}.book-select{max-width:180px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:10px 12px;color:var(--ink)}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.balance{background:#ffded0;border-color:#f6a06b;text-align:center;padding:25px 18px}.balance .eyebrow{color:var(--orange-dark);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.balance strong{display:block;color:var(--orange-dark);font-size:25px;line-height:1.2;margin:9px 0}.even{color:#56633f!important}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;border-radius:99px;padding:0 17px;background:transparent;border:1px solid var(--line);font-weight:750;color:var(--ink)}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff8ef}.btn.sage{background:var(--sage-light);border-color:#cbdcaf;color:#56633f}.btn.danger{color:#a34b33}.btn.small{min-height:34px;padding:0 11px;font-size:13px}.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 32px));min-height:52px;border-radius:18px;background:var(--orange);color:white;font-weight:800;font-size:16px;box-shadow:0 8px 18px #8c491a55;z-index:3}.expense{padding:14px 0;border-bottom:1px solid var(--line)}.expense:last-child{border-bottom:0;padding-bottom:0}.expense .amount{font-weight:800;color:var(--orange-dark);white-space:nowrap}.chip{border-radius:99px;background:var(--sage-light);color:#56633f;padding:7px 11px;font-weight:700}.chip.active{background:var(--orange);color:#fff}.field{display:grid;gap:6px}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted)}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fffdf9;padding:9px 11px;color:var(--ink)}input:focus,select:focus{outline:2px solid #f6a06b;outline-offset:1px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.member-line{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}.item{background:#fffdf9;border:1px solid var(--line);border-radius:15px;padding:12px;display:grid;gap:9px}.item .remove{justify-self:end;color:var(--orange-dark);background:none;font-weight:800}.toggle{display:flex;background:#f1e5d4;border-radius:99px;padding:3px}.toggle button{flex:1;border-radius:99px;min-height:36px;background:none;color:var(--muted);font-weight:750}.toggle button.active{background:var(--paper);color:var(--orange-dark);box-shadow:var(--shadow)}.empty{text-align:center;padding:24px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff8eff2;border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:9px 10px;z-index:2}.nav button{background:none;color:var(--muted);padding:7px 14px;border-radius:12px;font-weight:750}.nav button.active{background:var(--sage-light);color:#56633f}.notice{padding:11px 13px;background:#fff0dd;border-radius:13px;color:var(--orange-dark);font-size:13px}.settlement{background:#edf8dc;border-color:#ccdbb2}.settlement strong{color:#56633f}.checkboxes{display:flex;gap:6px;flex-wrap:wrap}.checkboxes label{display:flex;align-items:center;gap:5px;background:#f1e5d4;border-radius:99px;padding:6px 10px;font-size:13px}.checkboxes input{width:auto;min-height:0}.right{text-align:right}
    .balance{background:#f5f5f5;border-color:#111}.even{color:#111!important}.btn{border-radius:12px}.btn.primary,.fab{background:#111;border-color:#111;color:#fff}.btn.sage{background:#f3f3f3;border-color:#111;color:#111}.btn.danger,.expense .amount{color:#111}.chip,.nav button.active{background:#111;color:#fff}.item,input,select{background:#fff}.item{border-radius:12px}.toggle,.checkboxes label{background:#f3f3f3}.toggle button.active{color:#111;background:#fff}.settlement,.notice{background:#f5f5f5;border-color:#111}.nav{background:#fffffff2}.nav button.active{border-radius:9px}.fab{bottom:72px}.card{box-shadow:var(--shadow)}input:focus,select:focus{outline-color:#111}
  </style>
</head>
<body><main id="app"></main><script>
(() => {
  const KEY='saifu.books.v1', OLD='warikan.crew.v1';
  const CURRENCY={JPY:{symbol:'¥',dp:0},THB:{symbol:'฿',dp:0},USD:{symbol:'$',dp:2},EUR:{symbol:'€',dp:2}};
  const $=s=>document.querySelector(s), id=()=>Math.random().toString(36).slice(2,9), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,minimumFractionDigits:CURRENCY[c].dp,maximumFractionDigits:CURRENCY[c].dp}).format(Math.abs(n));
  const today=()=>new Date().toISOString().slice(0,10);
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.books?.length)return x}catch{};try{const x=JSON.parse(localStorage.getItem(OLD));const members=(x?.people||[]).map(p=>({id:id(),name:p.name||'Someone'}));if(members.length)return {books:[{id:id(),name:'Nina & Penny',currency:x.currency||'JPY',members,expenses:[],settlements:[]}],activeBookId:null}}catch{};return {books:[],activeBookId:null}}
  let state=load(); if(!state.activeBookId&&state.books[0])state.activeBookId=state.books[0].id; let screen=state.books.length?'balance':'book'; let form=null;
  function save(){localStorage.setItem(KEY,JSON.stringify(state))} function book(){return state.books.find(b=>b.id===state.activeBookId)}
  function balances(b){const out=Object.fromEntries(b.members.map(m=>[m.id,0]));b.expenses.forEach(e=>{out[e.payerId]=(out[e.payerId]||0)+e.total;e.shares.forEach(s=>{out[s.memberId]=(out[s.memberId]||0)-s.amount})});b.settlements.forEach(s=>{out[s.from]=(out[s.from]||0)+s.amount;out[s.to]=(out[s.to]||0)-s.amount});return out}
  function transfers(b){const bal=balances(b), owes=Object.entries(bal).filter(([,v])=>v<-.005).map(([memberId,amount])=>({memberId,amount:-amount})), gets=Object.entries(bal).filter(([,v])=>v>.005).map(([memberId,amount])=>({memberId,amount})), out=[];for(const o of owes)for(const g of gets){const amount=Math.min(o.amount,g.amount);if(amount>.005){out.push({from:o.memberId,to:g.memberId,amount});o.amount-=amount;g.amount-=amount}}return out}
  function name(b,i){return b.members.find(m=>m.id===i)?.name||'Someone'}
  function header(b){return `<header class="top"><div class="brand"><img class="logo" src="assets/saifu-logo.svg" alt="Saifu"><small>WHO OWES WHAT</small></div>${b?`<select class="book-select" id="bookSwitch">${state.books.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</header>`}
  function nav(){return `<nav class="nav">${[['balance','Balance'],['history','History'],['books','Books']].map(([x,t])=>`<button data-screen="${x}" class="${screen===x?'active':''}">${t}</button>`).join('')}</nav>`}
  function balanceView(b){const ts=transfers(b);return `<section class="card balance"><div class="eyebrow">${esc(b.name)}</div>${ts.length?ts.map(t=>`<strong>${esc(name(b,t.from))} owes ${esc(name(b,t.to))} ${money(t.amount,b.currency)}</strong>`).join(''):'<strong class="even">Everyone is even ✓</strong>'}<p class="muted">${b.expenses.length} expense${b.expenses.length===1?'':'s'} recorded</p></section><section class="card"><div class="row"><h2>Recent expenses</h2><button class="btn small" data-screen="history">View all</button></div>${b.expenses.length?b.expenses.slice().sort((a,z)=>z.date.localeCompare(a.date)).slice(0,5).map(expenseRow.bind(null,b)).join(''):'<div class="empty">Add your first shared expense.</div>'}</section>${ts.length?`<section class="card settlement"><div class="row"><div><h2>Settle up</h2><p class="muted">Record it without deleting any expenses.</p></div><button class="btn sage" data-settle="${ts[0].from}|${ts[0].to}|${ts[0].amount}">Mark settled</button></div></section>`:''}<button class="fab" data-screen="add">＋ Add expense</button>`}
  function expenseRow(b,e){return `<div class="expense"><div class="row"><div><h3>${esc(e.description||'Untitled expense')}</h3><span class="muted">${esc(e.date)} · ${esc(name(b,e.payerId))} paid</span></div><span class="amount">${money(e.total,b.currency)}</span></div></div>`}
  function historyView(b){const rows=[...b.expenses.map(e=>({...e,type:'expense'})),...b.settlements.map(s=>({...s,type:'settlement'}))].sort((a,z)=>(z.date||'').localeCompare(a.date||''));return `<div class="row"><div><h2>History</h2><p class="muted">Expenses stay here after settling up.</p></div><button class="btn primary" data-screen="add">＋ Add</button></div><section class="card">${rows.length?rows.map(x=>x.type==='expense'?`<div class="expense"><div class="row"><div><h3>${esc(x.description||'Untitled expense')}</h3><span class="muted">${esc(x.date)} · ${esc(name(b,x.payerId))} paid ${money(x.total,b.currency)}</span></div><div class="actions"><button class="btn small" data-edit="${x.id}">Edit</button><button class="btn small danger" data-delete="${x.id}">Delete</button></div></div></div>`:`<div class="expense"><h3>✓ Settled</h3><span class="muted">${esc(x.date)} · ${esc(name(b,x.from))} paid ${esc(name(b,x.to))} ${money(x.amount,b.currency)}</span></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}</section>`}
  function bookView(){return `<section class="card"><h2>Expense books</h2><p class="muted">Keep trips and households separate.</p><div class="stack" style="margin-top:14px">${state.books.map(b=>`<button class="btn ${b.id===state.activeBookId?'sage':''}" data-open-book="${b.id}">${esc(b.name)} <span class="muted">· ${b.members.length} people</span></button>`).join('')||'<div class="empty">Create your first book.</div>'}</div></section><section class="card"><h2>New expense book</h2><form id="bookForm" class="stack" style="margin-top:14px"><div class="field"><label>Name</label><input name="name" placeholder="Nina & Penny" required></div><div class="field"><label>Currency</label><select name="currency">${Object.keys(CURRENCY).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Members</label><input name="members" placeholder="Nina, Penny" required><span class="muted">Separate names with commas.</span></div><button class="btn primary">Create book</button></form></section>`}
  function bookFormView(){const b=book();if(!form)form={description:'',payerId:b.members[0]?.id,total:'',mode:'amount',date:today(),amounts:Object.fromEntries(b.members.map(m=>[m.id,''])),items:[]};return `<div class="row"><div><h2>${form.editId?'Edit':'Add'} expense</h2><p class="muted">${esc(b.name)}</p></div><button class="btn small" data-screen="balance">Cancel</button></div><form id="expenseForm" class="stack" style="margin-top:14px"><div class="grid2"><div class="field"><label>Description</label><input name="description" value="${esc(form.description)}" placeholder="Lunch" required></div><div class="field"><label>Date</label><input name="date" type="date" value="${form.date}"></div></div><div class="field"><label>Who paid?</label><select name="payerId">${b.members.map(m=>`<option value="${m.id}" ${m.id===form.payerId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="toggle"><button type="button" class="${form.mode==='amount'?'active':''}" data-mode="amount">Amount per person</button><button type="button" class="${form.mode==='items'?'active':''}" data-mode="items">Itemized</button></div>${form.mode==='amount'?amountMode(b):itemMode(b)}<div class="row"><strong>Bill total</strong><strong style="color:var(--orange-dark)" id="formTotal">${money(formTotal(),b.currency)}</strong></div><button class="btn primary">Save expense</button></form>`}
  function amountMode(b){return `<div class="field"><label>What each person consumed</label>${b.members.map(m=>`<div class="member-line"><span>${esc(m.name)}</span><input class="amount-input" data-member="${m.id}" inputmode="decimal" placeholder="0" value="${esc(form.amounts[m.id]||'')}"></div>`).join('')}<span class="muted">Enter each person’s share. The total is calculated automatically.</span></div>`}
  function itemMode(b){return `<div class="field"><label>Items</label>${form.items.map((it,i)=>`<div class="item"><button type="button" class="remove" data-remove-item="${i}">Remove ×</button><input data-item-label="${i}" placeholder="Item name" value="${esc(it.label)}"><input data-item-amount="${i}" inputmode="decimal" placeholder="Price" value="${esc(it.amount)}"><div class="checkboxes">${b.members.map(m=>`<label><input type="checkbox" data-item-person="${i}" value="${m.id}" ${it.people.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}</div></div>`).join('')}<button type="button" class="btn small" data-add-item>＋ Add item</button><span class="muted">Shared items split equally between selected people.</span></div>`}
  function formTotal(){return form.mode==='amount'?Object.values(form.amounts).reduce((a,v)=>a+num(v),0):form.items.reduce((a,x)=>a+num(x.amount),0)} function num(v){const n=parseFloat(v);return Number.isFinite(n)&&n>=0?n:0}
  function render(){const b=book();let content=header(b);if(screen==='book')content+=bookView();else if(screen==='books')content+=bookView();else if(screen==='add')content+=`<section class="card">${bookFormView()}</section>`;else content+=balanceView(b);if(b&&screen!=='add'&&screen!=='book')content+=nav();if(screen==='history')content=header(b)+historyView(b)+nav();if(screen==='books')content=header(b)+bookView()+nav();$('#app').innerHTML=content;bind()}
  function bind(){$('#bookSwitch')?.addEventListener('change',e=>{state.activeBookId=e.target.value;screen='balance';save();render()});document.querySelectorAll('[data-screen]').forEach(x=>x.onclick=()=>{if(x.dataset.screen==='add')form=null;screen=x.dataset.screen;render()});document.querySelectorAll('[data-open-book]').forEach(x=>x.onclick=()=>{state.activeBookId=x.dataset.openBook;screen='balance';save();render()});$('#bookForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),members=String(f.get('members')).split(',').map(x=>x.trim()).filter(Boolean).map(name=>({id:id(),name}));const b={id:id(),name:String(f.get('name')).trim(),currency:f.get('currency'),members,expenses:[],settlements:[]};state.books.push(b);state.activeBookId=b.id;screen='balance';save();render()});document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{form.mode=x.dataset.mode;render()});document.querySelectorAll('.amount-input').forEach(x=>x.oninput=()=>{form.amounts[x.dataset.member]=x.value;$('#formTotal').textContent=money(formTotal(),book().currency)});document.querySelectorAll('[data-add-item]').forEach(x=>x.onclick=()=>{form.items.push({label:'',amount:'',people:[]});render()});document.querySelectorAll('[data-remove-item]').forEach(x=>x.onclick=()=>{form.items.splice(+x.dataset.removeItem,1);render()});document.querySelectorAll('[data-item-label]').forEach(x=>x.oninput=()=>form.items[+x.dataset.itemLabel].label=x.value);document.querySelectorAll('[data-item-amount]').forEach(x=>x.oninput=()=>{form.items[+x.dataset.itemAmount].amount=x.value;$('#formTotal').textContent=money(formTotal(),book().currency)});document.querySelectorAll('[data-item-person]').forEach(x=>x.onchange=()=>{const p=form.items[+x.dataset.itemPerson].people;p.includes(x.value)?p.splice(p.indexOf(x.value),1):p.push(x.value)});$('#expenseForm')?.addEventListener('submit',saveExpense);document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(confirm('Delete this expense?')){const b=book();b.expenses=b.expenses.filter(e=>e.id!==x.dataset.delete);save();render()}});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editExpense(x.dataset.edit));document.querySelectorAll('[data-settle]').forEach(x=>x.onclick=()=>settle(x.dataset.settle))}
  function saveExpense(e){e.preventDefault();const b=book(),f=new FormData(e.target),total=formTotal();if(!total)return alert('Add some amounts first.');let shares;if(form.mode==='amount')shares=Object.entries(form.amounts).filter(([,v])=>num(v)>0).map(([memberId,v])=>({memberId,amount:num(v)}));else{if(form.items.some(it=>num(it.amount)>0&&!it.people.length))return alert('Choose who shared each item.');shares=Object.fromEntries(b.members.map(m=>[m.id,0]));for(const it of form.items){if(num(it.amount)&&it.people.length)it.people.forEach(p=>shares[p]+=num(it.amount)/it.people.length)}shares=Object.entries(shares).filter(([,v])=>v>0).map(([memberId,amount])=>({memberId,amount}))}const expense={id:form.editId||id(),description:String(f.get('description')).trim(),date:f.get('date')||today(),payerId:f.get('payerId'),total,shares,mode:form.mode,items:form.mode==='items'?form.items:[]};const i=b.expenses.findIndex(x=>x.id===expense.id);i<0?b.expenses.push(expense):b.expenses[i]=expense;form=null;screen='balance';save();render()}
  function editExpense(eid){const e=book().expenses.find(x=>x.id===eid),mode=e.mode||'amount';form={editId:e.id,description:e.description,payerId:e.payerId,total:String(e.total),mode,date:e.date,amounts:Object.fromEntries(book().members.map(m=>[m.id,String(e.shares.find(s=>s.memberId===m.id)?.amount||'')])),items:(e.items||[]).map(it=>({label:it.label,amount:String(it.amount),people:[...(it.people||[])]}))};screen='add';render()}
  function settle(raw){const [from,to,amount]=raw.split('|'),b=book();b.settlements.push({id:id(),from,to,amount:+amount,date:today()});save();render()}
  // ponytail: greedy creditor/debtor matching is O(n²); optimize only if groups become large.
  window.saifu={transfers};const demo={members:[{id:'a',name:'Penny'},{id:'b',name:'Nina'}],currency:'JPY',expenses:[{payerId:'a',total:3360,shares:[{memberId:'a',amount:1320},{memberId:'b',amount:2040}]},{payerId:'b',total:1600,shares:[{memberId:'a',amount:650},{memberId:'b',amount:950}]},{payerId:'b',total:1380,shares:[{memberId:'a',amount:1380}]}],settlements:[]};console.assert(Math.round(transfers(demo)[0].amount)===10,'example settlement should be ¥10');
  render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw-v3.js').catch(()=>{});
})();
</script></body></html>
