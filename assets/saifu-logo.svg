<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .stroke-white { stroke: #ffffff; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-white { fill: #ffffff; }
      .app-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 42px; fill: #ffffff; letter-spacing: 7px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect class="bg" width="512" height="512" rx="112" />

  <g transform="translate(0, -10)">
    <!-- Main Receipt Body -->
    <path class="stroke-white" d="M 186 120 
             L 326 120 
             L 326 340 
             L 302.3 325 
             L 278.7 340 
             L 256.0 325 
             L 233.3 340 
             L 209.7 325 
             L 186 340 
             Z" />

    <!-- Receipt Details (Food & Coffee Items) -->
    <!-- Coffee Cup Icon -->
    <path class="stroke-white" style="stroke-width: 12;" d="M 210 162 L 234 162 L 234 178 C 234 184 228 188 222 188 C 216 188 210 184 210 178 Z" />
    <path class="stroke-white" style="stroke-width: 10;" d="M 234 166 C 240 166 242 170 242 173 C 242 176 240 180 234 180" />
    <!-- Line Item 1 Price -->
    <line class="stroke-white" style="stroke-width: 12;" x1="262" y1="175" x2="302" y2="175" />

    <!-- Plate/Fork Icon -->
    <circle cx="222" cy="215" r="12" class="stroke-white" style="stroke-width: 10;" />
    <!-- Line Item 2 Price -->
    <line class="stroke-white" style="stroke-width: 12;" x1="262" y1="215" x2="302" y2="215" />

    <!-- Divider Line -->
    <line class="stroke-white" style="stroke-width: 8; stroke-dasharray: 8 8;" x1="210" y1="250" x2="302" y2="250" />

    <!-- Split Arrows Overlay (Sharing Concept) -->
    <!-- Left Split Arrow -->
    <path class="stroke-white" style="stroke-width: 20;" d="M 220 285 L 140 285 L 170 255" />
    <path class="stroke-white" style="stroke-width: 20;" d="M 140 285 L 170 315" />

    <!-- Right Split Arrow -->
    <path class="stroke-white" style="stroke-width: 20;" d="M 292 285 L 372 285 L 342 255" />
    <path class="stroke-white" style="stroke-width: 20;" d="M 372 285 L 342 315" />

    <!-- App Name -->
    <text x="256" y="425" class="app-title">SAIFU</text>
  </g>
</svg>
